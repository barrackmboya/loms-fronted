# nginx configuration for LOMS Frontend (Credit Desk)

server {
    listen 80;
    server_name localhost;

    # Root directory for the built React app
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Serve React app - all routes should serve index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;

        # Add headers for caching
        expires -1;
        add_header Cache-Control "no-cache, private";
    }

    # Health check endpoint
    location = /healthz {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # Serve static assets with proper caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Try to serve the file, fallback to index.html for SPA routing
        try_files $uri =404;
    }

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' http://localhost:8000 https:;";

    # Increase client body size for file uploads if needed
    client_max_body_size 10M;
}